<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREUS // 極速雙向同步與圖片傳輸站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for P2P Realtime Sync -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0b0b0b; color: #d4af37; font-family: sans-serif; }
        .gold-border { border: 1px solid #d4af37; }
        .gold-glow { box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
        .gold-button {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000000; font-weight: bold; transition: all 0.2s ease;
        }
        .gold-button:hover {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center pb-4 border-b border-yellow-900/40">
        <div>
            <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-500 to-yellow-700">
                AUREUS DIRECT
            </h1>
            <p class="text-xs text-yellow-600/80">雙向極速同步 // 支援文字與圖片傳輸</p>
        </div>
        <div class="text-right">
            <span class="text-xs text-neutral-400 block">連線狀態</span>
            <span id="conn-status" class="text-xs font-bold px-2 py-0.5 rounded bg-yellow-950 text-yellow-400 border border-yellow-800">等待裝置連接...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 my-6 flex-grow">
        
        <!-- Left: QR Code Pairing -->
        <div class="bg-neutral-900/90 p-5 rounded-xl gold-border gold-glow flex flex-col items-center justify-center text-center">
            <h2 class="text-sm font-semibold mb-3 text-yellow-400">手機掃碼配對（即時連線）</h2>
            <div id="qrcode" class="p-2 bg-white rounded-lg mb-3"></div>
            <p class="text-xs text-neutral-400 max-w-[200px]">
                用手機相機掃描上面 QR Code，手機開網頁後兩端會**自動建立即時連線**！
            </p>
        </div>

        <!-- Right: Realtime Text & Image Sharing -->
        <div class="md:col-span-2 bg-neutral-900/90 p-5 rounded-xl gold-border gold-glow flex flex-col gap-4">
            
            <!-- Text Box -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-yellow-400">📝 即時文字剪貼簿（打字雙向同步）</label>
                    <button onclick="copyText()" class="text-xs px-2 py-1 rounded border border-yellow-600 text-yellow-400 hover:bg-yellow-500/20">複製文字</button>
                </div>
                <textarea id="text-input" rows="5" class="w-full p-3 bg-black border border-yellow-900/60 rounded-lg text-yellow-100 placeholder-neutral-700 focus:outline-none focus:border-yellow-500 text-sm" placeholder="在任何一端輸入或貼上文字，另一端會即時出現..."></textarea>
            </div>

            <!-- Image Transfer -->
            <div class="border-t border-yellow-900/40 pt-3">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-yellow-400">🖼️ 圖片快傳區</label>
                    <label class="cursor-pointer text-xs px-3 py-1.5 rounded gold-button inline-block">
                        選擇/上傳圖片
                        <input type="file" id="image-input" accept="image/*" class="hidden">
                    </label>
                </div>
                <div id="image-container" class="min-h-[120px] bg-black border border-yellow-900/40 rounded-lg p-2 flex items-center justify-center">
                    <span id="no-img-tip" class="text-xs text-neutral-600">目前尚無同步圖片（可在電腦或手機上傳）</span>
                    <img id="shared-img" class="max-h-56 rounded hidden object-contain" alt="同步圖片" />
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Status -->
    <footer class="w-full max-w-4xl pt-3 border-t border-yellow-900/40 text-center text-xs text-neutral-500">
        配對 ID: <span id="my-id" class="font-mono text-yellow-600">生成中...</span>
    </footer>

    <!-- Engine JS -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('peer');

        const statusEl = document.getElementById('conn-status');
        const textInput = document.getElementById('text-input');
        const imageInput = document.getElementById('image-input');
        const sharedImg = document.getElementById('shared-img');
        const noImgTip = document.getElementById('no-img-tip');
        const myIdEl = document.getElementById('my-id');

        let peer = null;
        let activeConn = null;

        // 初始化 PeerJS
        peer = new Peer();

        peer.on('open', (id) => {
            myIdEl.innerText = id;

            if (!targetPeerId) {
                // 代表這是第一台裝置（例如電腦）
                const shareUrl = `${window.location.origin}${window.location.pathname}?peer=${id}`;
                new QRCode(document.getElementById("qrcode"), {
                    text: shareUrl, width: 140, height: 140
                });
            } else {
                // 代表這是掃碼進來的裝置（例如手機），主動連線給電腦
                statusEl.innerText = '正在連線至電腦...';
                const conn = peer.connect(targetPeerId);
                setupConnection(conn);

                // 隱藏手機端的 QR Code 區塊
                document.getElementById("qrcode").parentElement.style.display = 'none';
            }
        });

        // 當有人連線近來（電腦端接收手機連線）
        peer.on('connection', (conn) => {
            setupConnection(conn);
        });

        // 綁定連線邏輯
        function setupConnection(conn) {
            activeConn = conn;

            conn.on('open', () => {
                statusEl.innerText = '🟢 已連線成功 (雙向同步中)';
                statusEl.className = 'text-xs font-bold px-2 py-0.5 rounded bg-green-950 text-green-400 border border-green-800';

                // 如果本機已經有字，連線成立時立刻傳給對方
                if (textInput.value) {
                    conn.send({ type: 'text', data: textInput.value });
                }
            });

            // 收到對方傳來的資料
            conn.on('data', (data) => {
                if (data.type === 'text') {
                    textInput.value = data.data;
                } else if (data.type === 'image') {
                    sharedImg.src = data.data;
                    sharedImg.classList.remove('hidden');
                    noImgTip.classList.add('hidden');
                }
            });

            conn.on('close', () => {
                statusEl.innerText = '🔴 連線中斷';
                statusEl.className = 'text-xs font-bold px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800';
            });
        }

        // 文字即時輸入廣播
        textInput.addEventListener('input', () => {
            if (activeConn && activeConn.open) {
                activeConn.send({ type: 'text', data: textInput.value });
            }
        });

        // 圖片上傳廣播
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const imgData = evt.target.result;
                // 本地先顯示
                sharedImg.src = imgData;
                sharedImg.classList.remove('hidden');
                noImgTip.classList.add('hidden');

                // 傳給對方
                if (activeConn && activeConn.open) {
                    activeConn.send({ type: 'image', data: imgData });
                }
            };
            reader.readAsDataURL(file);
        });

        function copyText() {
            textInput.select();
            navigator.clipboard.writeText(textInput.value);
            alert('文字已複製！');
        }
    </script>
</body>
</html>
