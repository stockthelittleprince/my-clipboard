<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREUS // 黑金快傳與雲端暫存站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #0d0d0d;
            color: #d4af37;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        .gold-border { border: 1px solid #d4af37; }
        .gold-glow { box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .gold-button {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000000;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .gold-button:hover {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center pb-6 border-b border-yellow-900/40">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-500 to-yellow-700">
                AUREUS VAULT
            </h1>
            <p class="text-xs text-yellow-600/80 tracking-wider">黑金雲端暫存 // 自動同步紀錄</p>
        </div>
        <div class="text-right">
            <span class="text-xs text-yellow-600 block">同步頻道 (Channel)</span>
            <span id="room-id" class="text-sm font-mono font-bold text-yellow-400">LOADING...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 my-6 flex-grow">
        
        <!-- Left: QRCode & Actions -->
        <div class="bg-neutral-900/80 p-5 rounded-xl gold-border gold-glow flex flex-col items-center justify-between text-center">
            <div>
                <h2 class="text-sm font-semibold tracking-wider mb-4 text-yellow-400">手機掃碼打開同網頁</h2>
                <div id="qrcode" class="p-2 bg-black rounded-lg gold-border mb-4 inline-block"></div>
                <p class="text-xs text-neutral-400 max-w-[200px] mb-4">用手機相機掃描，即可隨時查看電腦留存的內容。</p>
            </div>
            <button onclick="fetchLatest()" class="w-full py-2 text-xs rounded gold-button mb-2">🔄 手動手動刷新抓取最新紀錄</button>
        </div>

        <!-- Right: Text Input & Storage Log -->
        <div class="md:col-span-2 bg-neutral-900/80 p-5 rounded-xl gold-border gold-glow flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold tracking-wider text-yellow-400">雲端暫存剪貼簿</label>
                    <span id="save-status" class="text-xs text-yellow-500 font-mono">已連線</span>
                </div>
                <textarea id="text-input" rows="7" class="w-full p-4 bg-black border border-yellow-900/50 rounded-lg text-yellow-100 placeholder-neutral-700 focus:outline-none focus:border-yellow-500 transition-colors" placeholder="在此輸入或貼上內容，系統會自動雲端暫存，手機開網頁即可看到..."></textarea>
            </div>

            <!-- Quick Cleaner Buttons -->
            <div class="mt-4">
                <span class="text-xs text-yellow-600 block mb-2">一鍵文字洗滌工具 (Auto-Clean)</span>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <button onclick="cleanUTM()" class="px-3 py-2 text-xs rounded gold-button">去除網址追蹤碼</button>
                    <button onclick="removeNewlines()" class="px-3 py-2 text-xs rounded gold-button">清除無用換行</button>
                    <button onclick="simpToTrad()" class="px-3 py-2 text-xs rounded gold-button">簡體轉繁體</button>
                    <button onclick="copyText()" class="px-3 py-2 text-xs rounded border border-yellow-500 text-yellow-400 hover:bg-yellow-500/10">複製文字</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Status -->
    <footer class="w-full max-w-4xl pt-4 border-t border-yellow-900/40 flex justify-between items-center text-xs text-neutral-500">
        <span>雲端同步狀態: <span id="status-text" class="text-yellow-500">就緒</span></span>
        <button onclick="clearData()" class="text-red-500 hover:underline">清空目前暫存</button>
    </footer>

    <!-- JavaScript Engine -->
    <script>
        // 1. 固定頻道號碼（基於日期與預設頻道，每天自動重置）
        const todayStr = new Date().toISOString().slice(0, 10);
        let roomId = window.location.hash.replace('#', '');
        if (!roomId) {
            roomId = 'vault-default';
            window.location.hash = roomId;
        }
        document.getElementById('room-id').innerText = roomId;

        // 2. 生成 QR Code (帶有完整網址與 Hash)
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 128,
            height: 128,
            colorDark : "#d4af37",
            colorLight : "#000000",
            correctLevel : QRCode.CorrectLevel.H
        });

        // 3. 使用免費公開快取 API 實現跨裝置暫存
        const API_URL = `https://api.keyvalue.xyz/set/aureus-${roomId}-${todayStr}`;
        const GET_URL = `https://api.keyvalue.xyz/get/aureus-${roomId}-${todayStr}`;

        const textarea = document.getElementById('text-input');
        const saveStatus = document.getElementById('save-status');
        let timer = null;

        // 開啟網頁時自動抓取雲端歷史資料
        async function fetchLatest() {
            saveStatus.innerText = '讀取中...';
            try {
                // 使用公共 CORS 代理或直接 Fetch
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://ntfy.sh/aureus-' + roomId + '-' + todayStr + '/raw')}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.contents && data.contents.trim() !== '') {
                        textarea.value = data.contents;
                        saveStatus.innerText = '已同步最新紀錄';
                    } else {
                        saveStatus.innerText = '尚無紀錄';
                    }
                }
            } catch (e) {
                // 退回到 LocalStorage 備用
                const local = localStorage.getItem('saved_aureus');
                if (local) textarea.value = local;
                saveStatus.innerText = '已載入本機資料';
            }
        }

        // 輸入內容時，延遲 1 秒自動同步上傳到雲端
        textarea.addEventListener('input', () => {
            saveStatus.innerText = '編輯中...';
            localStorage.setItem('saved_aureus', textarea.value);
            
            clearTimeout(timer);
            timer = setTimeout(async () => {
                saveStatus.innerText = '上傳暫存中...';
                try {
                    await fetch(`https://ntfy.sh/aureus-${roomId}-${todayStr}`, {
                        method: 'POST',
                        body: textarea.value
                    });
                    saveStatus.innerText = '已儲存至雲端 ✓';
                } catch(e) {
                    saveStatus.innerText = '本機已儲存';
                }
            }, 800);
        });

        // 4. 一鍵工具功能
        function cleanUTM() {
            let text = textarea.value;
            text = text.replace(/(https?:\/\/[^\s]+)/g, (url) => {
                try {
                    let u = new URL(url);
                    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'fbclid', 'gclid', 'igshid'].forEach(p => u.searchParams.delete(p));
                    return u.toString();
                } catch(e) { return url; }
            });
            updateText(text);
        }

        function removeNewlines() {
            let text = textarea.value;
            text = text.replace(/([^\n])\n([^\n])/g, '$1 $2').replace(/\n+/g, '\n');
            updateText(text);
        }

        function simpToTrad() {
            let text = textarea.value;
            const map = {'这':'這', '么':'麼', '摸':'麼', '体':'體', '国':'國', '学':'學', '写':'寫', '软':'軟', '件':'件', '网':'網', '页':'頁', '码':'碼', '设':'設', '计':'計', '资':'資', '料':'料', '发':'發', '现':'現', '动':'動', '简':'簡', '繁':'繁'};
            text = text.split('').map(char => map[char] || char).join('');
            updateText(text);
        }

        function copyText() {
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            document.getElementById('status-text').innerText = '已複製到剪貼簿！';
            setTimeout(() => { document.getElementById('status-text').innerText = '就緒'; }, 2000);
        }

        function clearData() {
            textarea.value = '';
            localStorage.removeItem('saved_aureus');
            textarea.dispatchEvent(new Event('input'));
        }

        function updateText(newText) {
            textarea.value = newText;
            textarea.dispatchEvent(new Event('input'));
        }

        // 頁面載入時自動執行一次抓取
        fetchLatest();
    </script>
</body>
</html>
